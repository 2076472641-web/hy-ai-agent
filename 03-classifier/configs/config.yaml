# 数据处理配置
data:
  min_title_length: 2
  max_title_length: 100
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42

# 特征工程配置
features:
  # 分词配置
  tokenizer:
    use_stopwords: true
    min_token_length: 1
    enable_pos_filter: false
  # TF-IDF配置
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
  # 文本嵌入配置
  embedding:
    use_word2vec: false
    bert_model: "bert-base-chinese"
    max_seq_length: 128
    pooling_strategy: "cls"

# 模型训练配置
models:
  # 随机森林
  random_forest:
    n_estimators: 200
    max_depth: 30
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
  
  # FastText
  fasttext:
    lr: 0.1
    epoch: 50
    wordNgrams: 2
    dim: 128
    loss: "softmax"
    bucket: 200000
    minCount: 2
  
  # BERT微调
  bert:
    base_model: "bert-base-chinese"
    num_labels: 12
    max_length: 128
    batch_size: 32
    learning_rate: 2.0e-5
    num_train_epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    gradient_accumulation_steps: 2
    fp16: false

# 模型压缩配置
compression:
  quantization:
    enabled: true
    dtype: "int8"
  distillation:
    enabled: true
    teacher_model: "bert-base-chinese"
    student_model: "distilbert-base-chinese"
    temperature: 4.0
    alpha: 0.5
    epochs: 3

# 推理服务配置
service:
  host: "0.0.0.0"
  port: 8000
  default_model: "bert_distilled"
  enable_batch: true
  max_batch_size: 64
  response_timeout: 30

# 评估配置
evaluation:
  primary_metric: "f1_macro"
  metrics: ["accuracy", "precision_macro", "recall_macro", "f1_micro", "f1_macro", "classification_report"]
  confusion_matrix: true
  roc_auc: false
