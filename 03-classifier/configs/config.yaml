  version: "1.0.0"
  author: "NLP工程团队"
  description: "基于NLP与机器学习的小程序商品自动化分类系统"

# 路径配置
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "data/models"
  logs: "logs"

